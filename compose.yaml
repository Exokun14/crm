services:
    laravel.test:
        build:
            context: '.'
            dockerfile: './docker/8.5/Dockerfile'
            args:
                WWWGROUP: '${WWWGROUP}'
        image: 'sail-8.5/app'
        extra_hosts:
            - 'host.docker.internal:host-gateway'
        ports:
            - '${APP_PORT:-80}:80'
            - '${VITE_PORT:-5173}:${VITE_PORT:-5173}'
        environment:
            WWWUSER: '${WWWUSER}'
            LARAVEL_SAIL: 1
            XDEBUG_MODE: '${SAIL_XDEBUG_MODE:-off}'
            XDEBUG_CONFIG: '${SAIL_XDEBUG_CONFIG:-client_host=host.docker.internal}'
            IGNITION_LOCAL_SITES_PATH: '${PWD}'
        volumes:
            - '.:/var/www/html'
        networks:
            - sail
        depends_on:
            - mysql
            - ollama

    mysql:
        image: 'mysql:8.4'
        ports:
            - '${FORWARD_DB_PORT:-3306}:3306'
        environment:
            MYSQL_ROOT_PASSWORD: '${DB_PASSWORD}'
            MYSQL_ROOT_HOST: '%'
            MYSQL_DATABASE: '${DB_DATABASE}'
            MYSQL_USER: '${DB_USERNAME}'
            MYSQL_PASSWORD: '${DB_PASSWORD}'
            MYSQL_ALLOW_EMPTY_PASSWORD: 1
            MYSQL_EXTRA_OPTIONS: '${MYSQL_EXTRA_OPTIONS:-}'
        volumes:
            - 'sail-mysql:/var/lib/mysql'
            - './docker/mysql/create-testing-database.sh:/docker-entrypoint-initdb.d/10-create-testing-database.sh'
        networks:
            - sail
        healthcheck:
            test:
                - CMD
                - mysqladmin
                - ping
                - '-p${DB_PASSWORD}'
            retries: 3
            timeout: 5s

    phpmyadmin:
        image: phpmyadmin/phpmyadmin
        ports:
            - "8080:80"
        environment:
            PMA_HOST: mysql
            PMA_PORT: 3306
            PMA_USER: root
            PMA_PASSWORD: '${DB_PASSWORD}'
        depends_on:
            - mysql
        networks:
            - sail

    ollama:
        image: ollama/ollama
        container_name: ollama
        ports:
            - '11434:11434'
        volumes:
            - sail-ollama:/root/.ollama
        networks:
            - sail
        restart: unless-stopped
        environment:
            - OLLAMA_KEEP_ALIVE=-1        # never unload the active model from RAM
            - OLLAMA_NUM_PARALLEL=1       # 1 request at a time (CPU only)
            - OLLAMA_MAX_LOADED_MODELS=1  # only 1 model in RAM — prevents memory swap
        deploy:
            resources:
                limits:
                    cpus: '8'       # reserves 4 cores for Laravel + MySQL
                    memory: 6g      # adjust if your laptop has less than 16GB RAM
        healthcheck:
            test: ["CMD-SHELL", "ollama list || exit 1"]
            interval: 10s
            timeout: 10s
            retries: 10
            start_period: 30s

    # ── Auto warm-up ────────────────────────────────────────────────────────────
    # Fires once after Ollama passes its healthcheck.
    # Warms ONLY qwen2.5:0.5b (light model) into RAM — covers ~90% of traffic.
    # llama3.2:latest loads on demand when token count >= 200.
    # Container exits cleanly — no manual steps needed.
    ollama-warmup:
        image: curlimages/curl:latest
        container_name: ollama-warmup
        depends_on:
            ollama:
                condition: service_healthy
        networks:
            - sail
        restart: "no"
        entrypoint: ["/bin/sh", "-c"]
        command:
            - |
                echo "🔥 Warming light model (qwen2.5:0.5b) into RAM..."
                curl -s -X POST http://ollama:11434/api/generate \
                    -H "Content-Type: application/json" \
                    -d '{"model":"qwen2.5:0.5b","prompt":"hi","stream":false}' \
                    --max-time 120 > /dev/null && echo "✅ qwen2.5:0.5b loaded and ready"

                echo "🚀 Aria is ready for the demo!"

networks:
    sail:
        driver: bridge

volumes:
    sail-mysql:
        driver: local
    sail-ollama:
        driver: local
